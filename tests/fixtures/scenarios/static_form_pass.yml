schema: cdpx.scenario/v1
name: static_form_pass
context:
  base_url: __BASE_URL__
steps:
  - label: form_page
    goto: /form.html
    capture: [screenshot, console, network]
  - include:
      path: fragments/static_form_interaction.yml
      as: form
assertions:
  - no_console_errors: true
  - network_errors_max: 0
  - text_contains: ["#result", "OK:Leo"]
artifacts:
  - screenshot
  - console
  - network
