<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>cdpx fixtures — rich interactions</title>
  <style>
    body { font: 16px/1.4 sans-serif; margin: 2rem; }
    button, input { font: inherit; }
    #hidden-button { display: none; }
    #pointer-events-button { pointer-events: none; }
    .hit-test-box { position: relative; width: 220px; height: 48px; margin: 1rem 0; }
    .hit-test-box > button { position: absolute; inset: 0; width: 100%; height: 100%; }
    #cover { position: absolute; inset: 0; z-index: 2; background: rgb(180 40 40 / 65%); }
    #descendant-button { position: relative; width: 220px; height: 48px; }
    #descendant-hit-area {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    output { display: block; margin-top: .5rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Rich interactions</h1>

  <button id="hidden-button" type="button">Hidden</button>
  <button id="disabled-button" type="button" disabled>Disabled</button>
  <button id="aria-disabled-button" type="button" aria-disabled="true">ARIA disabled</button>
  <span inert><button id="inert-button" type="button">Inert</button></span>
  <button id="pointer-events-button" type="button">No pointer events</button>

  <div class="hit-test-box">
    <button id="covered-button" type="button">Covered</button>
    <div id="cover" aria-label="Cover layer"></div>
  </div>

  <button id="descendant-button" type="button">
    <span id="descendant-hit-area">Clickable descendant</span>
  </button>

  <label for="controlled-input">Controlled field</label>
  <input id="controlled-input" value="initial">
  <output id="controlled-mirror">initial</output>
  <fieldset id="segmented-code">
    <legend>Segmented code</legend>
    <input class="code-digit" inputmode="numeric" maxlength="1" aria-label="Code digit 1">
    <input class="code-digit" inputmode="numeric" maxlength="1" aria-label="Code digit 2">
    <input class="code-digit" inputmode="numeric" maxlength="1" aria-label="Code digit 3">
    <input class="code-digit" inputmode="numeric" maxlength="1" aria-label="Code digit 4">
    <input class="code-digit" inputmode="numeric" maxlength="1" aria-label="Code digit 5">
    <input class="code-digit" inputmode="numeric" maxlength="1" aria-label="Code digit 6">
  </fieldset>
  <output id="segmented-code-result"></output>
  <output id="interaction-state"></output>

  <script>
    (() => {
      const clicks = {
        hidden: 0,
        disabled: 0,
        ariaDisabled: 0,
        inert: 0,
        pointerEvents: 0,
        covered: 0,
        descendant: 0,
      };
      const inputEvents = [];
      const state = document.querySelector('#interaction-state');
      const input = document.querySelector('#controlled-input');
      const mirror = document.querySelector('#controlled-mirror');
      const codeDigits = [...document.querySelectorAll('.code-digit')];
      const codeResult = document.querySelector('#segmented-code-result');

      const render = () => {
        state.textContent = JSON.stringify({ clicks, inputEvents });
      };
      const clickTargets = {
        hidden: '#hidden-button',
        disabled: '#disabled-button',
        ariaDisabled: '#aria-disabled-button',
        inert: '#inert-button',
        pointerEvents: '#pointer-events-button',
        covered: '#covered-button',
        descendant: '#descendant-button',
      };
      for (const [name, selector] of Object.entries(clickTargets)) {
        document.querySelector(selector).addEventListener('click', () => {
          clicks[name] += 1;
          render();
        });
      }
      for (const type of ['beforeinput', 'input']) {
        input.addEventListener(type, event => {
          inputEvents.push({ type, inputType: event.inputType, value: input.value });
          if (type === 'input') mirror.textContent = input.value;
          render();
        });
      }
      codeDigits.forEach((field, index) => {
        field.addEventListener('input', event => {
          if (!event.isTrusted || !/^\d$/.test(field.value)) return;
          if (index < codeDigits.length - 1) codeDigits[index + 1].focus();
          const code = codeDigits.map(digit => digit.value).join('');
          codeResult.textContent = code.length === codeDigits.length ? 'complete' : '';
        });
      });

      window.interactionFixture = {
        snapshot: () => ({
          clicks: { ...clicks },
          input: input.value,
          mirror: mirror.textContent,
          inputEvents: inputEvents.map(event => ({ ...event })),
          segmentedCode: codeDigits.map(digit => digit.value).join(''),
          segmentedComplete: codeResult.textContent,
        }),
      };
      render();
    })();
  </script>
</body>
</html>
