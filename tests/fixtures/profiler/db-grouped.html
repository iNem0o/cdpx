<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Symfony Profiler — grouped db</title></head>
<body><div id="collector-content">
<h2>Query Metrics</h2>
<div class="metrics">
  <div class="metric"><span class="value">6</span><span class="label">Database Queries</span></div>
  <div class="metric"><span class="value">2</span><span class="label">Different statements</span></div>
  <div class="metric"><span class="value">1.76 <span class="unit">ms</span></span><span class="label">Query time</span></div>
</div>
<h2>Queries</h2>
<table class="alt queries-table">
  <thead><tr><th>Count</th><th>Time</th><th>Info</th></tr></thead>
  <tbody>
    <tr><td>1</td><td>0.42 ms</td><td><pre>SELECT * FROM book</pre></td></tr>
    <tr><td>5</td><td>1.34 ms</td><td><pre>SELECT * FROM author WHERE id = ?</pre></td></tr>
  </tbody>
</table>
</div></body>
</html>
